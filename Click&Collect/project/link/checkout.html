<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Checkout</title>
    </head>
    <body>
        <header class="header">
            <nav class="nave">
                <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" style="width: 180px; height: auto;">
                    <circle cx="50" cy="50" r="40" fill="#ffffff" opacity="0.15" />
                    <circle cx="50" cy="50" r="34" fill="#ff6a00" />
                    <text x="50" y="59" font-family="'Inter', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">ML</text>
                    <text x="105" y="62" font-family="'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#ffffff">mega<tspan fill="#ff6a00">loja</tspan></text>
                </svg>
                <div class="menu-links">
                    <a href="index.html">🏠 Home</a>
                    <a href="produto.html">🛍️ Produto</a>
                    <a href="checkout.html" class="active">🛒 Click & Collect</a>
                </div>
            </nav>
        </header>

        <!-- Envolva a section principal nesta classe para alinhar com o menu lateral -->
        <main class="conteudo-principal">
            <section class="checkout">
                <h1 class="center">Escolha como vai retirar o produto:</h1>
                <div>
                    <div class="opcoes">
                        <div class="opcao" id="retirar">
                            <h3>🏪 Retirar na loja</h3>
                            <p>Retire em uma de nossas unidades.</p>
                        </div>
                        <div class="opcao" id="entrega">
                            <h3>🛍️ Entrega no local</h3>
                            <p>Receba o produto no local desejado.</p>
                        </div>
                    </div>
                    <div id="info"></div>
                    <div id="resultado"></div>
                </div>
            </section>
        </main>

        <div id="modelo" class="modelo">
            <div class="modelo-conteudo">
                <span id="fechar">&times;</span>
                <div id="conteudomodelo"></div>
            </div>
        </div>
        <script src="checkout.js"></script>
    </body>
</html>
