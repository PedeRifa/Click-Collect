<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <!-- Ícone Circular Estilo Magalu -->
  <circle cx="50" cy="50" r="40" fill="#0086ff" />
  <!-- Efeitos de Brilho Dinâmico dentro do Ícone -->
  <path d="M25 35 C 40 20, 60 20, 75 35" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M30 65 C 45 75, 65 75, 75 60" stroke="#ff6a00" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Iniciais "M" e "L" Cruzadas com Estilo -->
  <text x="50" y="58" font-family="'Inter', 'Arial Black', sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">ML</text>

  <!-- Tipografia do Nome da Marca -->
  <text x="110" y="62" font-family="'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#ffffff">mega<tspan fill="#ff6a00">loja</tspan></text>
  
  <!-- Slogan Discreto / Conceito Click & Collect -->
  <text x="112" y="82" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#e6f3ff" letter-spacing="2">CLICK &amp; COLLECT</text>
</svg>
