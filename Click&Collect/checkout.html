<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Checkout</title>
    </head>
    <body>
        <header class="header">
            <nav class="nave">
                <img class="logo" src="imagem/click&collect.png" alt="Logo">
                <div>
                    <a href="index.html">Home</a>
                    <a href="produto.html">Produto</a>
                    <a href="checkout.html">Checkout</a>
                </div>
            </nav>
        </header>
        <section class="checkout">
            <h1 class="center">Checkout</h1>
            <div>
                <h2>Escolha como vai retirar o produto:</h2>
                <div class="opcoes">
                    <div>
                        <label for="retirar">Retirar na loja:</label>
                        <input type="radio" id="retirar" name="tipodeentrega">
                    </div>
                    <div>
                        <label for="entrega">Entrega no local:</label>
                        <input type="radio" id="entrega" name="tipodeentrega">
                    </div>
                    <div id="info"></div>
                    <div id="resultado"></div>
                </div>
            </div>
        </section>
        <script src="checkout.js"></script>
    </body>
</html>
